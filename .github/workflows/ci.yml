name: CI

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

# Mínimo privilegio para el GITHUB_TOKEN; cada job pide solo lo que necesita.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/orders-service
  TRIVY_IMAGE: aquasec/trivy:0.73.0

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unitarias, ArchUnit, Cucumber (surefire) + integración con Testcontainers (failsafe).
      - name: Build and run all tests
        run: mvn -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/cucumber-report.html

  security-scan:
    name: Dependency, secret & IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Falla el pipeline ante vulnerabilidades HIGH/CRITICAL con fix disponible o secretos expuestos.
      - name: Trivy - dependencies and secrets
        run: >
          docker run --rm -v "$PWD:/src" ${{ env.TRIVY_IMAGE }}
          fs --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /src

      # Malas configuraciones en Dockerfile, manifiestos de Kubernetes y Terraform (informativo).
      - name: Trivy - misconfigurations (Dockerfile, k8s, Terraform)
        run: >
          docker run --rm -v "$PWD:/src" ${{ env.TRIVY_IMAGE }}
          config --severity HIGH,CRITICAL --exit-code 0 /src

  docker:
    name: Docker image
    needs: [build-and-test, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy - image scan
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ${{ env.TRIVY_IMAGE }}
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
