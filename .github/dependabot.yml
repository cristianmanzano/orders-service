version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      spring:
        patterns: ["org.springframework*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    target-branch: develop

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
