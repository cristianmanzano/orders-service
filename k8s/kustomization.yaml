apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders
resources:
  - namespace.yaml
  - configmap.yaml
  - service.yaml
  - deployment.yaml
  - hpa.yaml
labels:
  - pairs:
      app.kubernetes.io/name: orders-service
      app.kubernetes.io/part-of: orders-platform
# El secreto se crea fuera de Git (ver secret.example.yaml).
# Para cambiar la imagen en CI/CD:  kustomize edit set image ghcr.io/cmanzano/orders-service=<imagen>:<tag>
images:
  - name: ghcr.io/cmanzano/orders-service
    newTag: 1.0.0
