# EJEMPLO. No versionar secretos reales: en un clúster real se sincronizan desde AWS Secrets Manager
# o Azure Key Vault con External Secrets Operator / Secrets Store CSI Driver.
#
#   kubectl -n orders create secret generic orders-service-secrets \
#     --from-literal=DB_USERNAME=orders \
#     --from-literal=DB_PASSWORD='<password>' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
apiVersion: v1
kind: Secret
metadata:
  name: orders-service-secrets
type: Opaque
stringData:
  DB_USERNAME: orders
  DB_PASSWORD: change-me
  JWT_SECRET: change-me-with-openssl-rand-base64-48
