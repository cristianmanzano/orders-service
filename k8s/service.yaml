apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-service
  annotations:
    # IRSA: el pod asume este rol IAM sin credenciales estáticas (ver infra/terraform).
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/orders-service
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  labels:
    app: orders-service
spec:
  type: ClusterIP
  selector:
    app: orders-service
  ports:
    - name: http
      port: 80
      targetPort: http
